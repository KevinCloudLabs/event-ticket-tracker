<div class="settings-page">
  <div class="page-header">
    <h1>Settings</h1>
    <p>Your account details</p>
  </div>

  <mat-card class="profile-card">
    <div class="profile-row">
      <span class="field-label">Name</span>
      <span class="field-value">{{ authService.currentUser()?.name || '—' }}</span>
    </div>
    <div class="profile-row">
      <span class="field-label">Email</span>
      <span class="field-value">{{ authService.currentUser()?.email }}</span>
    </div>
    <div class="profile-row">
      <span class="field-label">Role</span>
      <span class="field-value">{{ authService.currentUser()?.role }}</span>
    </div>

    <button mat-stroked-button color="warn" class="logout-button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Sign out
    </button>
  </mat-card>
</div>
